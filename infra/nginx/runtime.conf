# Serves the respondent runtime (a static single-page app) and proxies /api to the API, so the
# runtime reaches the API on its own origin. On AWS, CloudFront does the same with two origins.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  include /etc/nginx/snippets/runtime-headers.conf;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
  }

  location /assets/ {
    expires 1y;
    include /etc/nginx/snippets/runtime-headers.conf;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
    include /etc/nginx/snippets/runtime-headers.conf;
    add_header Cache-Control "no-store";
  }
}

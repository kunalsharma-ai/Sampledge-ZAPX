# Serves the offline interviewer (CAPI) app and proxies /api to the API, so the app and its
# session cookie stay on one origin. The service worker is never cached, so updates reach devices.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  include /etc/nginx/snippets/capi-headers.conf;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/capi-headers.conf;
  }

  location /assets/ {
    expires 1y;
    include /etc/nginx/snippets/capi-headers.conf;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
    include /etc/nginx/snippets/capi-headers.conf;
    add_header Cache-Control "no-store";
  }
}

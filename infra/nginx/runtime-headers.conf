# Security headers for the respondent runtime (Milestone 20). nginx drops server-level add_header
# lines in any location that has its own add_header, so every location includes this file.
# Surveys may be embedded by customers, so framing is not restricted here.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Permissions-Policy "geolocation=(), payment=(), usb=(), camera=(self), microphone=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

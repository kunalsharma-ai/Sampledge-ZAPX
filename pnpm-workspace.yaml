packages:
  - 'apps/*'
  # The mobile app is an Expo project with its own npm lockfile (apps/mobile/README.md).
  - '!apps/mobile'
  - 'packages/*'
  - 'e2e'
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - esbuild
  - '@nestjs/core'
  - bcrypt
  - sharp

# Security floors for transitive dependencies (see docs/security.md).
overrides:
  postcss@<8.5.18: '>=8.5.18'
  sharp@<0.35.5: '^0.35.5'
  path-to-regexp@>=8.0.0 <8.4.0: '^8.4.0'
  multer@<2.5.0: '^2.5.0'
  uuid@<11.1.1: '^11.1.1'

auditConfig:
  # minimatch 3/5 inside exceljs's zip writer (archiver): it only matches SampCode's own fixed patterns,
  # never user input, and minimatch 10+ changed its API so it cannot be forced (docs/security.md).
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249

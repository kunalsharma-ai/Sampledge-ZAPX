<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7 -7 78 78" width="128" height="128" role="img" aria-label="SampCode icon"><title>SampCode icon</title><style>
.m-flt{animation:mFlt 6s ease-in-out infinite}
@keyframes mFlt{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
.m-l{animation:mL 5s cubic-bezier(.3,1.4,.4,1) infinite}@keyframes mL{0%,4%{transform:translateX(-12px);opacity:0}20%,88%{transform:none;opacity:1}100%{transform:translateX(-12px);opacity:0}}
.m-r{animation:mR 5s cubic-bezier(.3,1.4,.4,1) infinite}@keyframes mR{0%,8%{transform:translateX(12px);opacity:0}24%,88%{transform:none;opacity:1}100%{transform:translateX(12px);opacity:0}}
.m-core{transform-box:fill-box;transform-origin:50% 50%;animation:mCore 1.8s ease-in-out infinite}@keyframes mCore{0%,100%{transform:scale(.8);opacity:.75}50%{transform:scale(1.15);opacity:1}}
.m-up{transform-box:fill-box;transform-origin:50% 50%;animation:mUp 5s cubic-bezier(.3,1.6,.5,1) infinite}@keyframes mUp{0%,4%{transform:translateY(10px) scale(.4);opacity:0}20%,88%{transform:none;opacity:1}100%{transform:translateY(-6px) scale(.8);opacity:0}}
.m-spark{transform-box:fill-box;transform-origin:50% 50%;animation:mSpk 2.5s ease-in-out infinite}@keyframes mSpk{0%,100%{transform:scale(.4) rotate(0);opacity:.3}50%{transform:scale(1.1) rotate(90deg);opacity:1}}
.m-spin{transform-origin:32px 33px;animation:mSpin 14s linear infinite}@keyframes mSpin{to{transform:rotate(360deg)}}
.m-gat{animation:mGat 5s cubic-bezier(.3,1.4,.4,1) infinite}@keyframes mGat{0%,4%{transform:translate(var(--x),var(--y));opacity:0}22%,88%{transform:none;opacity:1}100%{transform:translate(var(--x),var(--y));opacity:0}}
.m-g1{animation:mG1 5s cubic-bezier(.3,1.4,.4,1) infinite}@keyframes mG1{0%,4%{transform:translateY(-12px);opacity:0}22%,88%{transform:none;opacity:1}100%{transform:translateY(-12px);opacity:0}}
.m-g2{animation:mG2 5s cubic-bezier(.3,1.4,.4,1) infinite}@keyframes mG2{0%,8%{transform:translate(-11px,7px);opacity:0}26%,88%{transform:none;opacity:1}100%{transform:translate(-11px,7px);opacity:0}}
.m-g3{animation:mG3 5s cubic-bezier(.3,1.4,.4,1) infinite}@keyframes mG3{0%,12%{transform:translate(11px,7px);opacity:0}30%,88%{transform:none;opacity:1}100%{transform:translate(11px,7px);opacity:0}}
.m-dash{animation:mDash 1.6s cubic-bezier(.5,0,.3,1) infinite}@keyframes mDash{0%,40%{transform:translateX(0)}60%{transform:translateX(4px)}100%{transform:translateX(0)}}
.m-dash2{animation:mDash 1.6s .12s cubic-bezier(.5,0,.3,1) infinite}
.m-route{stroke-dasharray:60;animation:mRoute 5s cubic-bezier(.6,0,.3,1) infinite}@keyframes mRoute{0%,8%{stroke-dashoffset:60}48%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:60}}
.m-peak{transform-box:fill-box;transform-origin:50% 50%;animation:mPeak 5s cubic-bezier(.3,1.8,.5,1) infinite}@keyframes mPeak{0%,46%{transform:scale(0)}56%,88%{transform:scale(1)}100%{transform:scale(0)}}
.m-arc{transform-origin:13px 51px;animation:mArc 2.4s ease-out infinite}@keyframes mArc{0%{transform:scale(.82);opacity:.35}35%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:.55}}
.m-pct{transform-origin:32px 31px;animation:mPct 5s cubic-bezier(.5,0,.2,1.3) infinite}@keyframes mPct{0%,22%{transform:rotate(-90deg) scale(0);opacity:0}38%,88%{transform:none;opacity:1}100%{transform:rotate(90deg) scale(0);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><svg x="-7" y="-7" width="78" height="78" viewBox="-7 -7 78 78" overflow="visible"><defs><linearGradient id="gai" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"></stop><stop offset="1" stop-color="#6366F1"></stop></linearGradient><linearGradient id="gbi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366F1"></stop><stop offset="1" stop-color="#A855F7"></stop></linearGradient><linearGradient id="gci" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A855F7"></stop><stop offset="1" stop-color="#22D3EE"></stop></linearGradient><linearGradient id="hli" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"></stop><stop offset=".55" stop-color="#fff" stop-opacity="0"></stop></linearGradient><filter id="mgi" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#6366F1" flood-opacity="0.35"></feDropShadow></filter></defs><g class="m-flt" filter="url(#mgi)"><g class="m-l"><polygon points="26,8 6,32 26,56 38,56 18,32 38,8" fill="url(#gai)" stroke-linejoin="round"></polygon><polygon points="26,8 6,32 26,56 38,56 18,32 38,8" fill="url(#hli)"></polygon></g><g class="m-r"><polygon points="38,8 58,32 38,56 26,56 46,32 26,8" fill="url(#gbi)" opacity=".82"></polygon><polygon points="38,8 58,32 38,56 26,56 46,32 26,8" fill="url(#hli)" opacity=".6"></polygon></g><polygon class="m-core" points="32,25 39,32 32,39 25,32" fill="#FFFFFF"></polygon></g></svg></svg>
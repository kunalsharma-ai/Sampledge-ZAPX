name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zapx
          POSTGRES_PASSWORD: zapx
          POSTGRES_DB: zapx
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zapx" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: cp .env.example .env
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm --filter @zapx/e2e exec playwright install --with-deps chromium
      - run: set -a && . ./.env && set +a && pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results

  # Known vulnerabilities in dependencies fail the build at high severity.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level high

  # Builds the production images and boots the whole stack with docker compose.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for API, studio, runtime and interviewer app
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/api/health && curl -fsS -o /dev/null http://localhost:3000/login \
              && curl -fsS -o /dev/null http://localhost:5173/ && curl -fsS http://localhost:5173/api/health \
              && curl -fsS -o /dev/null http://localhost:5174/sw.js && curl -fsS http://localhost:5174/api/health; then
              echo "stack is up"; exit 0
            fi
            sleep 5
          done
          docker compose ps; docker compose logs --tail 80; exit 1
      - if: always()
        run: docker compose down -v
